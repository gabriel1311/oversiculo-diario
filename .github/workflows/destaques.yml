name: Stories de destaque

# Publica as 3 artes (Sobre · Versículos · Oração) como Stories. Depois é só
# fixar cada uma como destaque pelo app (Novo destaque > escolher do arquivo).

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: destaques
  cancel-in-progress: false

jobs:
  destaques:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Publicar stories
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}
          IMAGEM_REF: ${{ github.sha }}
        run: python -m src.destaques --fase publicar
