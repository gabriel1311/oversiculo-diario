name: Publicar versículo do dia

on:
  schedule:
    # A inteligência (dados/inteligencia.json) escolhe a hora do post de cada
    # dia entre 8h, 12h e 19h de Brasília. Os crons cobrem os três horários
    # (minutos fora da hora cheia, que é onde o GitHub mais atrasa), e o passo
    # "É a hora de hoje?" decide qual deles publica. Os disparos seguintes ao
    # que publicou funcionam como rede de segurança e não fazem nada.
    - cron: "3 11 * * *"   # 08:00 Brasília
    - cron: "43 11 * * *"  # segurança das 8h
    - cron: "3 15 * * *"   # 12:00 Brasília
    - cron: "43 15 * * *"  # segurança das 12h
    - cron: "3 22 * * *"   # 19:00 Brasília
    - cron: "43 22 * * *"  # segurança das 19h
  workflow_dispatch:
    inputs:
      ensaio:
        description: "Gerar imagem e legenda sem publicar"
        type: boolean
        default: false

# Necessário para o job commitar a imagem e o histórico de volta.
permissions:
  contents: write

# Evita duas execuções simultâneas empurrando commits em cima uma da outra.
concurrency:
  group: publicar-versiculo
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # O disparo de segurança (2º cron) e retries caem aqui: se o post do dia
      # já está no histórico, não há nada a fazer — nem gerar, nem commitar.
      # Evita push desnecessário (que pode falhar à toa) e alarme falso.
      - name: Já publicou hoje?
        id: ja
        run: |
          hoje=$(date -u +%Y-%m-%d)
          if python3 -c "import json,sys; h=json.load(open('dados/historico.json')); sys.exit(0 if any(x.get('data')=='$hoje' for x in h) else 1)"; then
            echo "pulado=true" >> "$GITHUB_OUTPUT"
            echo "Post de $hoje já publicado — nada a fazer."
          else
            echo "pulado=false" >> "$GITHUB_OUTPUT"
          fi

      # A inteligência escolhe a hora do dia (8h/12h/19h Brasília). Um disparo
      # antes da hora escolhida não publica; os depois dela publicam (o que
      # também cobre o caso de um cron anterior ter sido pulado). Disparo
      # manual (workflow_dispatch) publica sempre.
      - name: É a hora de hoje?
        id: hora
        if: ${{ steps.ja.outputs.pulado != 'true' }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "agora=true" >> "$GITHUB_OUTPUT"
            echo "Disparo manual: publica agora."
          elif python3 -c "
          import sys, datetime
          sys.path.insert(0, '.')
          from src import inteligencia
          alvo = inteligencia.hora_do_dia(datetime.date.today())
          agora_utc = datetime.datetime.now(datetime.timezone.utc)
          agora_brt = (agora_utc.hour - 3) % 24
          print(f'hora escolhida: {alvo}h Brasília; agora: {agora_brt}h')
          sys.exit(0 if agora_brt >= alvo else 1)
          "; then
            echo "agora=true" >> "$GITHUB_OUTPUT"
          else
            echo "agora=false" >> "$GITHUB_OUTPUT"
            echo "Ainda não é a hora escolhida de hoje — nada a fazer."
          fi

      - uses: actions/setup-python@v5
        if: ${{ inputs.ensaio || (steps.ja.outputs.pulado != 'true' && steps.hora.outputs.agora == 'true') }}
        with:
          python-version: "3.12"
          cache: pip

      - if: ${{ inputs.ensaio || (steps.ja.outputs.pulado != 'true' && steps.hora.outputs.agora == 'true') }}
        run: pip install -r requirements.txt

      - name: Garantir ffmpeg
        if: ${{ inputs.ensaio || (steps.ja.outputs.pulado != 'true' && steps.hora.outputs.agora == 'true') }}
        run: ffmpeg -version >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Gerar imagem, vídeo e legenda
        if: ${{ inputs.ensaio || (steps.ja.outputs.pulado != 'true' && steps.hora.outputs.agora == 'true') }}
        run: |
          python -m src.principal --fase ${{ inputs.ensaio && 'ensaio' || 'preparar' }}

      - name: Guardar os arquivos como artefato
        if: ${{ inputs.ensaio || (steps.ja.outputs.pulado != 'true' && steps.hora.outputs.agora == 'true') }}
        uses: actions/upload-artifact@v4
        with:
          name: post-do-dia
          path: posts/
          retention-days: 14

      - name: Publicar os arquivos no repositório
        if: ${{ !inputs.ensaio && steps.ja.outputs.pulado != 'true' && steps.hora.outputs.agora == 'true' }}
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts
          if git diff --cached --quiet; then
            # Os arquivos de hoje já foram commitados (retry no mesmo dia, ou o
            # post já rodou). Não é erro: o commit atual já os contém, então
            # seguimos para publicar usando o HEAD como referência.
            echo "Arquivos do dia já commitados; usando o commit atual."
          else
            git commit -m "Post de $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash || true
            git push
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publicar no Instagram
        if: ${{ !inputs.ensaio && steps.ja.outputs.pulado != 'true' && steps.hora.outputs.agora == 'true' }}
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}
          # Fixa a URL do vídeo no commit recém-enviado, em vez do nome do
          # branch, para não esbarrar no cache do raw.githubusercontent.
          IMAGEM_REF: ${{ steps.commit.outputs.sha }}
        run: python -m src.principal --fase publicar

      - name: Registrar histórico e agenda
        if: ${{ !inputs.ensaio && steps.ja.outputs.pulado != 'true' && steps.hora.outputs.agora == 'true' }}
        run: |
          git add dados/historico.json dados/agenda.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Histórico e agenda: $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash
          git push

  # Se a publicação falhar, abre (ou comenta) uma issue no repositório — um aviso
  # visível sem depender de serviço externo. O GitHub também manda e-mail ao dono.
  avisar-falha:
    needs: publicar
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Abrir ou atualizar issue de falha
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          corpo=$(printf 'A automação de publicação falhou em %s UTC.\n\nLog: %s' "$(date -u '+%Y-%m-%d %H:%M')" "$RUN_URL")
          num=$(gh issue list --state open --label falha-publicacao --json number --jq '.[0].number // empty' -R "$GITHUB_REPOSITORY")
          if [ -n "$num" ]; then
            gh issue comment "$num" --body "$corpo" -R "$GITHUB_REPOSITORY"
          else
            gh label create falha-publicacao --color B60205 --description "Falha na automação" -R "$GITHUB_REPOSITORY" 2>/dev/null || true
            gh issue create --title "⚠️ Falha ao publicar o versículo do dia" --label falha-publicacao --body "$corpo" -R "$GITHUB_REPOSITORY"
          fi
