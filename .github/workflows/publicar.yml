name: Publicar versículo do dia

on:
  schedule:
    # 11:00 UTC = 08:00 em Brasília. O GitHub costuma atrasar alguns minutos
    # em horários cheios; não é problema para um post diário.
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      ensaio:
        description: "Gerar imagem e legenda sem publicar"
        type: boolean
        default: false

# Necessário para o job commitar a imagem e o histórico de volta.
permissions:
  contents: write

# Evita duas execuções simultâneas empurrando commits em cima uma da outra.
concurrency:
  group: publicar-versiculo
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Garantir ffmpeg
        run: ffmpeg -version >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Gerar imagem, vídeo e legenda
        run: |
          python -m src.principal --fase ${{ inputs.ensaio && 'ensaio' || 'preparar' }}

      - name: Guardar os arquivos como artefato
        uses: actions/upload-artifact@v4
        with:
          name: post-do-dia
          path: posts/
          retention-days: 14

      - name: Publicar os arquivos no repositório
        if: ${{ !inputs.ensaio }}
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts
          if git diff --cached --quiet; then
            # Os arquivos de hoje já foram commitados (retry no mesmo dia, ou o
            # post já rodou). Não é erro: o commit atual já os contém, então
            # seguimos para publicar usando o HEAD como referência.
            echo "Arquivos do dia já commitados; usando o commit atual."
          else
            git commit -m "Post de $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash || true
            git push
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publicar no Instagram
        if: ${{ !inputs.ensaio }}
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}
          # Fixa a URL do vídeo no commit recém-enviado, em vez do nome do
          # branch, para não esbarrar no cache do raw.githubusercontent.
          IMAGEM_REF: ${{ steps.commit.outputs.sha }}
        run: python -m src.principal --fase publicar

      - name: Registrar histórico e agenda
        if: ${{ !inputs.ensaio }}
        run: |
          git add dados/historico.json dados/agenda.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Histórico e agenda: $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash
          git push

  # Se a publicação falhar, abre (ou comenta) uma issue no repositório — um aviso
  # visível sem depender de serviço externo. O GitHub também manda e-mail ao dono.
  avisar-falha:
    needs: publicar
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Abrir ou atualizar issue de falha
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          corpo=$(printf 'A automação de publicação falhou em %s UTC.\n\nLog: %s' "$(date -u '+%Y-%m-%d %H:%M')" "$RUN_URL")
          num=$(gh issue list --state open --label falha-publicacao --json number --jq '.[0].number // empty' -R "$GITHUB_REPOSITORY")
          if [ -n "$num" ]; then
            gh issue comment "$num" --body "$corpo" -R "$GITHUB_REPOSITORY"
          else
            gh label create falha-publicacao --color B60205 --description "Falha na automação" -R "$GITHUB_REPOSITORY" 2>/dev/null || true
            gh issue create --title "⚠️ Falha ao publicar o versículo do dia" --label falha-publicacao --body "$corpo" -R "$GITHUB_REPOSITORY"
          fi
