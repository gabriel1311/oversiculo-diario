name: Coletar métricas

# Puxa curtidas/comentários/alcance/seguidores do Instagram e grava
# dados/metricas.json (a página de controle lê daqui). Roda uma vez por dia,
# à noite, quando os posts do dia já tiveram tempo de engajar.

on:
  schedule:
    - cron: "0 23 * * *" # todo dia 23:00 UTC (20h Brasília)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metricas
  cancel-in-progress: false

jobs:
  metricas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Coletar métricas
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}
        run: python -m src.metricas

      # Re-treina a inteligência com os dados novos e regrava a agenda (as
      # decisões de estilo/tamanho/hora dos próximos dias podem mudar).
      - name: Aprender com os dados
        run: |
          python -m src.inteligencia
          python -c "from src import versiculos; versiculos.escrever_agenda()"

      - name: Commitar métricas e aprendizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/metricas.json dados/metricas-historico.json dados/inteligencia.json dados/agenda.json
          if git diff --cached --quiet; then
            echo "sem mudança"
            exit 0
          fi
          git commit -m "Métricas e aprendizado: $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash
          git push
